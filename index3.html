<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let numero = prompt(
        "Digite um numero para saber se eh positivo, negativo ou zero:"
      );
      if (numero > 0) {
        alert("O número digitado foi " + numero + " e ele é POSITIVO");
      } else if (numero < 0) {
        alert("O número digitado foi " + numero + " e ele é NEGATIVO");
      } else {
        alert("O número digitado foi " + numero + " e ele é ZERO");
      }
    </script>
  </body>
</html>
