<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS TE AMO</title>
  </head>
  <body>
    <script>
      alert("PAULO SERGIO FRAGA MARCOS EU TE AMO MUITO!");
      console.log("INICIO DECRESCENDO");
      for (let i = 50; i >= 0; i--) {
        console.log("OIE PAULINHO DECRESCENDO " + i);
      }
      console.log("FINAL DECRESCENDO");
      console.log("INICIO CRESCENDO");
      for (let i = 0; i <= 50; i++) {
        console.log("OIE PAULINHO CRESCENDO " + i);
      }
      console.log("CRESCENDO");
    </script>
  </body>
</html>
