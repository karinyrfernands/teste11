<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      alert("Bem-vindo a calculadora de soma!");
      let numero1 = prompt("Digite o primeiro número da soma:");
      let numero2 = prompt("Digite o segundo número da soma:");
      let resultado = Number(numero1) + Number(numero2);
      alert(
        "O resultado da soma " + numero1 + " + " + numero2 + " = " + resultado
      );
    </script>
  </body>
</html>
